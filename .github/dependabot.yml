version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/landing-page"
    schedule:
      interval: "weekly"
    groups:
       vite-stack:
          patterns:
             - "vite"
             - "vitest"
             - "@vitest/*"
